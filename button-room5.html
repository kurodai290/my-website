<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>第五のボタンの間</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hint {
            color: #555555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .button-container {
            background-color: #0a0a0a;
            border: 2px solid #444444;
            padding: 50px;
            border-radius: 5px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        /* 運命を決める漆黒のボタン */
        .fate-btn {
            background-color: #111111;
            color: #ff3333;
            border: 2px solid #555555;
            padding: 25px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'MS Mincho', 'serif';
            letter-spacing: 5px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }
        .fate-btn:hover {
            background-color: #ff3333;
            color: #000000;
            border-color: #ff3333;
            box-shadow: 0 0 25px #ff3333;
        }
        .fate-btn:disabled {
            background-color: #000000;
            color: #333333;
            border-color: #222222;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box {
            margin-top: 30px;
            font-size: 18px;
            color: #aaaaaa;
            min-height: 40px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>10分の5の試練：button-room5</h1>
    <div class="hint">――ついに半分まで来た。10分の5の運命に身を委ねよ――</div>

    <div class="button-container">
        <button id="gambleBtn5" class="fate-btn" onclick="tryLuck5()">運命を起動</button>
        <div id="statusResult5" class="result-box">ボタンが静かにあなたの指を待っている……。</div>
    </div>

    <script {nonce}>
        function tryLuck5() {
            const btn = document.getElementById('gambleBtn5');
            const status = document.getElementById('statusResult5');
            
            btn.disabled = true; 
            status.style.color = "#aaaaaa";
            status.innerHTML = "確率を計算中…… 運命の分岐点を観測しています……";

            setTimeout(() => {
                // 1から10までのランダムな整数
                const randomNumber = Math.floor(Math.random() * 10) + 1;

                // 💡 10分の5の確率（1, 2, 3, 4, 5が出たら見事アタリ！）
                if (randomNumber <= 5) {
                    // アタリ：さらに50%の確率で「鏡の中の部屋」か「もう一方の部屋」に分岐
                    const nextRoute = Math.random() < 0.5 ? "mirror-room.html" : "shadow-room.html";
                    
                    status.style.color = "#00ffcc";
                    status.innerHTML = "【認証成功】 10分の5の運命を掴み取った。";

                    setTimeout(() => {
                        if (nextRoute === "mirror-room.html") {
                            alert("カチャリ。目の前に巨大な姿見（かがみ）が現れ、自分の姿が不気味に映り込んだ。");
                        } else {
                            alert("ゾワッ……。自分の影が勝手に動き出すような、妙な感覚の部屋へと迷い込んだ。");
                        }
                        window.location.href = nextRoute;
                    }, 1000);

                } else {
                    // ハズレ（50%の確率）：既存のゲームオーバーへ
                    status.style.color = "#ff0000";
                    status.innerHTML = "【拒絶】 半分の確率に破れ、闇に消えました。";

                    setTimeout(() => {
                        alert("不合格。暗闇があなたを消滅させた。");
                        window.location.href = "dark-hazure2.html";
                    }, 1000);
                }
            }, 1500);
        }

        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
