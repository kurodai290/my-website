<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ふぁんしーなしま - 第2部</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #f7f2ff;

    color: #333;

    font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow-x: hidden;

}

.container {

    width: min(800px, 90%);

    text-align: center;

}

#message {

    min-height: 180px;

    font-size: 1.15rem;

    line-height: 2.2;

}

.fade {

    opacity: 0;

    transition: opacity 1s;

}

#title {

    font-size: 2.2rem;

    font-weight: bold;

    opacity: 0;

    transition: opacity 2s;

}

#title.show {

    opacity: 1;

}

#button-area {

    margin-top: 40px;

    opacity: 0;

    transition: opacity 2s;

}

#button-area.show {

    opacity: 1;

}

button {

    padding: 13px 45px;

    border: 2px solid #333;

    background: white;

    color: #333;

    font-size: 1rem;

    cursor: pointer;

    border-radius: 8px;

}

button:hover {

    background: #333;

    color: white;

}


/* スマホ */

@media (max-width: 600px) {

    #message {

        font-size: 1rem;

    }

    #title {

        font-size: 1.8rem;

    }

}

</style>

</head>


<body>


<div class="container">


    <div id="message">

        ……クリア？

    </div>


    <div id="title">

        ふぁんしーなしま<br>

        <span>第2部</span>

    </div>


    <div id="button-area">

        <button onclick="nextStage()">

            先へ進む

        </button>

    </div>


</div>


<script>


const message =
    document.getElementById("message");


const title =
    document.getElementById("title");


const buttonArea =
    document.getElementById("button-area");


/*
========================================
最初
========================================
*/

setTimeout(function() {

    message.classList.add("fade");


    setTimeout(function() {

        message.innerHTML =
            "……と思った？";

        message.classList.remove("fade");

    }, 1000);

}, 2500);


/*
========================================
次
========================================
*/

setTimeout(function() {

    message.classList.add("fade");


    setTimeout(function() {

        message.innerHTML =
            "まだまだ終わりじゃない。";

        message.classList.remove("fade");

    }, 1000);

}, 5000);


/*
========================================
第2部タイトル
========================================
*/

setTimeout(function() {

    title.classList.add("show");

}, 7500);


/*
========================================
ボタン
========================================
*/

setTimeout(function() {

    buttonArea.classList.add("show");

}, 9500);


/*
========================================
次へ
========================================
*/

function nextStage() {

    window.location.href =
        "record-room.html";

}

</script>


</body>

</html>
