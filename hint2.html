<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>第二の啓示</title>
    <style>
        html, body {
            background-color: #000000; color: #ffffff; font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; user-select: none; overflow: hidden;
        }
        .hint-card {
            background-color: #050505; border: 1px dashed #444444; padding: 40px;
            max-width: 500px; width: 90%; text-align: center;
        }
        .glyph {
            color: #00ffcc; font-size: 48px; font-weight: bold; margin: 30px 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .return-btn {
            display: inline-block; margin-top: 20px; background-color: #111111; color: #ffffff;
            border: 1px solid #444444; padding: 10px 30px; text-decoration: none; transition: 0.3s;
        }
        .return-btn:hover { background-color: #ffffff; color: #000000; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="hint-card">
        <h2 style="color: #0099ff;">第二の記憶の欠片</h2>
        <p style="color: #888; font-size: 15px;">湿った空気の中、引き揚げられた水底のハッチの裏に、文字が刻まれている。</p>
        
        <!-- 💡 キーワードの1文字目：シ -->
        <div class="glyph">「 シ 」</div>
        
        <a href="hub-room.html" class="return-btn">探索へ戻る</a>
    </div>
    <script {nonce}>
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
