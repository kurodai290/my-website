<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ボタンの間</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hint {
            color: #555555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* 🔘 巨大なボタンを設置するエリア */
        .button-container {
            background-color: #0a0a0a;
            border: 2px solid #333333;
            padding: 50px;
            border-radius: 5px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* 運命を決める漆黒のボタン */
        .fate-btn {
            background-color: #111111;
            color: #ff3333; /* 危険を察知させる赤 */
            border: 2px solid #555555;
            padding: 25px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'MS Mincho', 'serif';
            letter-spacing: 5px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }
        .fate-btn:hover {
            background-color: #ff3333;
            color: #000000;
            border-color: #ff3333;
            box-shadow: 0 0 25px #ff3333;
        }
        .fate-btn:disabled {
            background-color: #000000;
            color: #333333;
            border-color: #222222;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 確率計算中のテキスト表示 */
        .result-box {
            margin-top: 30px;
            font-size: 18px;
            color: #aaaaaa;
            min-height: 40px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>10分の2の試練：button-room</h1>
    <div class="hint">――運命は細い糸。10分の2の確率を掴み取れ――</div>

    <div class="button-container">
        <!-- プレイヤーが意を決して押すボタン -->
        <button id="gambleBtn" class="fate-btn" onclick="tryLuck()">運命を起動</button>
        
        <!-- 計算中のドキドキ演出テキストが出る場所 -->
        <div id="statusResult" class="result-box">ボタンが静かにあなたの指を待っている……。</div>
    </div>

    <script {nonce}>
        function tryLuck() {
            const btn = document.getElementById('gambleBtn');
            const status = document.getElementById('statusResult');
            
            btn.disabled = true; // 連打禁止
            status.style.color = "#aaaaaa";
            status.innerHTML = "確率を計算中…… 精神を同調させています……";

            // 1.5秒のタメ（ドキドキさせる演出）のあとに確率判定
            setTimeout(() => {
                // 1から10までのランダムな整数を作成
                const randomNumber = Math.floor(Math.random() * 10) + 1;

                // 💡 10分の2の確率（1か2が出たら見事アタリ、3〜10ならハズレ）
                if (randomNumber <= 2) {
                    // アタリの場合：さらに50%の確率で「水浸し廊下」か「時計の部屋」に分岐
                    const nextRoute = Math.random() < 0.5 ? "water-corridor.html" : "clock-room.html";
                    
                    status.style.color = "#00ffcc";
                    status.innerHTML = "【認証成功】 10分の2の狭間を潜り抜けた。";

                    setTimeout(() => {
                        if (nextRoute === "water-corridor.html") {
                            alert("ガシャーン！床が抜け、激しい水の音が響く場所へ落下した！");
                        } else {
                            alert("チクタクチクタク……不気味なネジの音が響く部屋の扉が開いた。");
                        }
                        // それぞれの次のファイルへジャンプ
                        window.location.href = nextRoute;
                    }, 1000);

                } else {
                    // ハズレの場合（80%の確率）：設計図通り「10/2以外ゲームオーバー」
                    status.style.color = "#ff0000";
                    status.innerHTML = "【拒絶】 運命の糸が切断されました。";

                    setTimeout(() => {
                        alert("不合格。暗黒があなたを飲み込んだ。");
                        // ゲームオーバー部屋（dark-hazure.html）へ強制送還
                        window.location.href = "dark-hazure.html";
                    }, 1000);
                }
            }, 1500);
        }

        // デベロッパーツール対策
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
