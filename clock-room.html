<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>時計の部屋</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ffcc00; /* 時間をイメージした鈍い金色 */
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .hint {
            color: #555555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .room-container {
            background-color: #0a0905;
            border: 2px solid #554400;
            padding: 40px;
            border-radius: 5px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.05);
        }

        .story-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #aaaaaa;
        }

        /* 🔘 時計を調べるためのボタン */
        .clock-btn {
            background-color: #1a1500;
            color: #ffcc00;
            border: 1px solid #665500;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'MS Mincho', 'serif';
            margin-bottom: 25px;
        }
        .clock-btn:hover {
            background-color: #ffcc00;
            color: #000000;
        }

        /* 答えの入力エリア */
        input {
            background-color: #000000;
            border: 1px solid #665500;
            color: #ffcc00;
            font-size: 24px;
            width: 150px;
            text-align: center;
            padding: 8px;
            outline: none;
            letter-spacing: 2px;
        }

        .submit-btn {
            display: block;
            margin: 25px auto 0 auto;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 10px 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'MS Mincho', 'serif';
        }
        .submit-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>試練の間：逆回転する時計の部屋</h1>
    <div class="hint">――巻き戻る歯車。狂った時間が指し示す真実を見抜く――</div>

    <div class="room-container">
        <div class="story-text">
            カチカチカチ……部屋中に無数の古時計が並んでいる。<br>
            中央にある一番大きな時計の針だけが、恐ろしい速度で「逆方向」に回転している。<br>
            鉄の扉には、4桁の暗号錠が固くかけられている……。
        </div>

        <!-- 時計を調べるボタン -->
        <button class="clock-btn" onclick="examineClock()">時計を調べる</button>

        <div>
            <p style="font-size:14px; color:#666;">扉を解く『4桁の暗号時間』は？</p>
            <input type="text" id="clockInput" placeholder="0000" maxlength="4" onkeydown="if(event.key==='Enter') checkClock()">
            <button class="submit-btn" onclick="checkClock()">鍵を開ける</button>
        </div>
    </div>

    <script {nonce}>
        // 💡 12:00から逆回転（引き算）で45分戻すと「11:15」になります
        function examineClock() {
            alert("『正位置の「12:00」から、狂った時間が45分だけ過去へ巻き戻った。針はその場所でピタリと固まり、微動だにしない。』");
        }

        function checkClock() {
            const ans = document.getElementById("clockInput").value.trim();
            
            // 正解は「1115」
            if (ans === "1115") {
                alert("ガシャリ！ 重々しい音を立てて、奥の部屋へ続く鉄の扉が開いた！");
                // 🗺️ クリア後の移動先：こちらも第二のバトル（battle-room2.html）へ合流します！
                window.location.href = "button-room3.html";
            } else {
                alert("ピピッ……！ 不正解。時計の針がさらに激しく狂いだし、部屋が激しく揺れ始めた！");
                // 間違えたらゲームオーバー部屋へ
                window.location.href = "dark-hazure.html";
            }
        }

        // デベロッパーツール対策
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
