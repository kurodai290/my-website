<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>暗闇の果てⅡ</title>
    <style>
        html, body {
            background-color: #000000; /* 完全な漆黒 */
            color: #d60000; /* 血のような赤色 */
            font-family: 'MS Mincho', 'serif';
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none;
            overflow: hidden;
        }

        h1 {
            font-size: 48px;
            letter-spacing: 15px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #ff0000;
        }

        .message {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 60px;
            letter-spacing: 2px;
            line-height: 1.8;
            text-align: center;
        }

        /* 最初に戻るボタン */
        .retry-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid #ffffff;
            padding: 15px 40px;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .retry-btn:hover {
            color: #000000;
            background-color: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 💡 仕掛けや隠しボタンは一切ない、10分の2エリア専用の完全なゲームオーバー画面です -->

    <h1>☠️ GAME OVER ☠️</h1>
    
    <div class="message">
        あなたは10分の2の運命に嫌われてしまった……。<br>
        確率の狭間に囚われ、意識は永遠の闇へと沈んでいく。
    </div>

    <!-- 💡 クリックすると一番最初のトップページ（index.html）に戻ります -->
    <a href="index.html" class="retry-btn">最初からやり直す</a>

    <!-- デベロッパーツール対策 -->
    <script {nonce}>
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
