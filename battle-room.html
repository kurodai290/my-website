<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>死闘の間</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
            position: relative;
        }

        h1 {
            color: #ff0000;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
            z-index: 5;
        }

        /* ⏳ 制限時間タイマー */
        .timer-box {
            font-size: 24px;
            color: #ff3333;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 5;
        }

        /* ⚔️ バトル画面のメインコンテナ */
        .battle-container {
            background-color: #0a0a0a;
            border: 2px solid #333333;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 5;
        }

        /* 👹 敵の画像を表示するエリア */
        .enemy-image-box {
            width: 100%;
            height: 220px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            border: 1px solid #1a1a1a;
            overflow: hidden;
        }
        .enemy-image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* ホラー演出：呼吸しているようにゆっくり揺らす */
            animation: ghostFloat 4s ease-in-out infinite;
        }

        /* ステータス（HP）表示 */
        .status-area {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #222222;
            padding-bottom: 15px;
        }
        .hp-bar { color: #ff0000; font-weight: bold; }

        /* バトルの実況ログ */
        .log-box {
            background-color: #000000;
            border: 1px solid #1a1a1a;
            height: 90px;
            padding: 12px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            margin-bottom: 20px;
            color: #aaaaaa;
        }

        /* コマンドボタン */
        .command-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .cmd-btn {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'MS Mincho', 'serif';
        }
        .cmd-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* 🩸 ダメージを受けた時の画面血しぶきフラッシュ（最初は非表示） */
        #damage-flash {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(139, 0, 0, 0.6); /* 透明度のある血の赤 */
            z-index: 999;
            pointer-events: none; /* クリックを邪魔しない設定 */
        }

        /* 敵の浮遊アニメーション */
        @keyframes ghostFloat {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); filter: brightness(1.2); }
            100% { transform: translateY(0px) scale(1); }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 🩸 ダメージエフェクト用画面 -->
    <div id="damage-flash"></div>

    <h1>🚨 警告：未知の怪異が接近 🚨</h1>
    
    <div class="timer-box">残り時間: <span id="timeLeft">60</span>秒</div>

    <div class="battle-container">
        
        <!-- 👹 敵のグラフィックエリア -->
        <div class="enemy-image-box">
            <!-- 💡 画像ファイルを obake.png に固定しました -->
            <img src="obake.png" alt="異形の顔">
        </div>

        <!-- HP表示エリア -->
        <div class="status-area">
            <div>あなた: <span id="playerHp" class="hp-bar">100</span> / 100</div>
            <div>怪異の影: <span id="enemyHp" class="hp-bar">150</span> / 150</div>
        </div>

        <!-- ログ表示 -->
        <div id="battleLog" class="log-box">
            不気味な顔が闇から這い出てきた……！<br>
            身体が恐怖で震えている。対抗手段を選べ。
        </div>

        <!-- コマンド -->
        <div class="command-area">
            <button class="cmd-btn" onclick="playerAction('attack')">渾身の突撃</button>
            <button class="cmd-btn" onclick="playerAction('counter')">反撃の構え</button>
            <button class="cmd-btn" onclick="playerAction('heal')">精神統一（回復）</button>
            <button class="cmd-btn" onclick="playerAction('light')">光を放つ（弱体）</button>
        </div>
    </div>

    <script {nonce}>
        let player = { hp: 100, maxHp: 100, isCountering: false };
        let enemy = { hp: 150, isWeak: false };
        let timeLeft = 60;
        let timerInterval;

        // ⏱️ タイマー処理
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timeLeft").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                battleOver(false, "時間切れ……。怪異の底へと引きずり込まれた。");
            }
        }, 1000);

        function addLog(text) {
            const logBox = document.getElementById("battleLog");
            logBox.innerHTML += "<br>" + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 🔄 プレイヤー行動
        function playerAction(type) {
            if (player.hp <= 0 || enemy.hp <= 0) return;
            player.isCountering = false;

            if (type === 'attack') {
                let dmg = enemy.isWeak ? 40 : 20;
                enemy.hp = Math.max(0, enemy.hp - dmg);
                addLog(`⚔️ あなたの攻撃！敵に ${dmg} のダメージ！`);
                enemy.isWeak = false;
            } else if (type === 'counter') {
                player.isCountering = true;
                addLog("🛡️ 敵の動向をじっと見据え、身を構えた。");
            } else if (type === 'heal') {
                let healAmount = 30;
                player.hp = Math.min(player.maxHp, player.hp + healAmount);
                addLog(`💚 呼吸を整えた。HPが ${healAmount} 回復した。`);
            } else if (type === 'light') {
                enemy.isWeak = true;
                addLog("✨ わずかな閃光を浴びせた！敵が激しく悶絶している！");
            }

            document.getElementById("enemyHp").innerText = enemy.hp;
            document.getElementById("playerHp").innerText = player.hp;

            if (enemy.hp <= 0) {
                clearInterval(timerInterval);
                setTimeout(() => battleOver(true, "怪異の顔は、苦悶の表情を浮かべながら闇へ霧散した。"), 500);
                return;
            }

            setTimeout(enemyTurn, 800);
        }

        // 👹 敵のターン
        function enemyTurn() {
            if (player.hp <= 0 || enemy.hp <= 0) return;

            let rand = Math.random();
            if (rand < 0.7) {
                if (player.isCountering) {
                    let counterDmg = 35;
                    enemy.hp = Math.max(0, enemy.hp - counterDmg);
                    document.getElementById("enemyHp").innerText = enemy.hp;
                    addLog(`⚡ カウンター的中！怪異の突進を跳ね返し、 ${counterDmg} のダメージ！`);
                    
                    if (enemy.hp <= 0) {
                        clearInterval(timerInterval);
                        setTimeout(() => battleOver(true, "決死の反撃により、怪異を完全に消滅させた！"), 500);
                        return;
                    }
                } else {
                    let dmg = 25;
                    player.hp = Math.max(0, player.hp - dmg);
                    
                    // 🩸 ダメージを受けた時の画面赤フラッシュ演出
                    const flash = document.getElementById("damage-flash");
                    flash.style.display = "block";
                    setTimeout(() => { flash.style.display = "none"; }, 200);

                    addLog(`💥 怪異が激しく牙を剥く！あなたは ${dmg} の痛烈な一撃を受けた！`);
                }
            } else {
                enemy.isWeak = true;
                addLog("👁️ 画像の目が血走る……！凄まじい殺気が膨れ上がっている！");
            }

            document.getElementById("playerHp").innerText = player.hp;

            if (player.hp <= 0) {
                clearInterval(timerInterval);
                setTimeout(() => battleOver(false, "意識が遠のいていく……。"), 500);
            }
        }

        function battleOver(isWin, message) {
            alert(message);
            if (isWin) {
                window.location.href = "code-release.html";
            } else {
                window.location.href = "dark-hazure.html";
            }
        }

        // デベロッパーツール対策
        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
