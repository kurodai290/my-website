<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリア画面</title>
    <style>
        body {
            background-color: #000000;
            color: #ff0000;
            font-family: "ヒラギノ明朝 ProN", "Hiragino Mincho ProN", "MS 明朝", "MS Mincho", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            letter-spacing: 0.1em;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            font-weight: normal;
            letter-spacing: 0.5em; /* 文字の間隔を広くして画像の雰囲気に */
            text-indent: 0.5em; /* 中央揃えのズレを調整 */
        }
        p {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 3rem;
            color: #ffffff; /* サブタイトルは画像に合わせて白にしています */
        }
        .btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 10px 30px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>くりあ</h1>
    <p>こんぐらっちゅれーしょん</p>
    
    <!-- ボタンのリンク先（#）に次のページのURLを入れてください -->
    <a href="#" class="btn">最初からやり直す</a>

</body>
</html>
