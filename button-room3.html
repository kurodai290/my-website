<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>第三のボタンの間</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hint {
            color: #555555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .button-container {
            background-color: #0a0a0a;
            border: 2px solid #444444;
            padding: 50px;
            border-radius: 5px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .fate-btn {
            background-color: #111111;
            color: #ff3333;
            border: 2px solid #555555;
            padding: 25px 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'MS Mincho', 'serif';
            letter-spacing: 5px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }
        .fate-btn:hover {
            background-color: #ff3333;
            color: #000000;
            border-color: #ff3333;
            box-shadow: 0 0 25px #ff3333;
        }
        .fate-btn:disabled {
            background-color: #000000;
            color: #333333;
            border-color: #222222;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box {
            margin-top: 30px;
            font-size: 18px;
            color: #aaaaaa;
            min-height: 40px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>10分の3の試練：button-room3</h1>
    <div class="hint">――運命はさらに細くなる。10分の3の光を掴み取れ――</div>

    <div class="button-container">
        <button id="gambleBtn3" class="fate-btn" onclick="tryLuck3()">運命を起動</button>
        <div id="statusResult3" class="result-box">ボタンが静かにあなたの指を待っている……。</div>
    </div>

    <script {nonce}>
        function tryLuck3() {
            const btn = document.getElementById('gambleBtn3');
            const status = document.getElementById('statusResult3');
            
            btn.disabled = true; 
            status.style.color = "#aaaaaa";
            status.innerHTML = "確率を計算中…… 深層の意識を同調させています……";

            setTimeout(() => {
                const randomNumber = Math.floor(Math.random() * 10) + 1;

                // 💡 30%の確率でアタリ
                if (randomNumber <= 3) {
                    const nextRoute = Math.random() < 0.5 ? "sound-room.html" : "liar-room.html";
                    
                    status.style.color = "#00ffcc";
                    status.innerHTML = "【認証成功】 10分の3의 難関を潜り抜けた。";

                    setTimeout(() => {
                        if (nextRoute === "sound-room.html") {
                            alert("ガシャリ。どこからか不気味なレコードのノイズが響く部屋へ導かれた。");
                        } else {
                            alert("ガチャリ。3つの奇妙なボタンと、碑文が刻まれた不気味な部屋の扉が開いた。");
                        }
                        window.location.href = nextRoute;
                    }, 1000);

                } else {
                    // 💡 移動先を「dark-hazure2.html」に統一しました！
                    status.style.color = "#ff0000";
                    status.innerHTML = "【拒絶】 運命の切断を確認。";

                    setTimeout(() => {
                        alert("不合格。暗闇があなたを塗り潰した。");
                        window.location.href = "dark-hazure2.html";
                    }, 1000);
                }
            }, 1500);
        }

        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
