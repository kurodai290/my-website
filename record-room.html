<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>記録</title>


<style>

/* ========================================
   基本設定
======================================== */

* {
    box-sizing: border-box;
}


html {
    min-height: 100%;
}


body {

    margin: 0;

    min-height: 100vh;

    background: #f4f1e8;

    color: #252525;

    font-family:
        "ヒラギノ明朝 ProN",
        "Hiragino Mincho ProN",
        "Yu Mincho",
        "MS Mincho",
        serif;

    display: flex;

    justify-content: center;

    align-items: center;

    /*
       横方向は画面からはみ出さないようにする
       縦方向はスクロール可能
    */

    overflow-x: hidden;

    overflow-y: auto;

    padding: 30px 15px;

}


/* ========================================
   部屋
======================================== */

.room {

    width: min(850px, 100%);

    min-height: 600px;

    background: #fffdf5;

    border: 1px solid #aaa;

    padding: 45px;

    position: relative;

    box-shadow:
        0 0 25px rgba(0,0,0,0.12);

}


/* ========================================
   タイトル
======================================== */

h1 {

    text-align: center;

    font-size: 2rem;

    font-weight: normal;

    margin-top: 0;

    margin-bottom: 35px;

    letter-spacing: 0.3em;

}


/* ========================================
   記録
======================================== */

.record {

    border-top: 1px solid #999;

    border-bottom: 1px solid #999;

    padding: 20px 10px;

    line-height: 2.2;

    font-size: 1rem;

}


.record span {

    color: #777;

}


/* ========================================
   「おかしい」
======================================== */

.warning {

    margin-top: 35px;

    text-align: center;

    font-size: 1.2rem;

    opacity: 0;

    transition:
        opacity 2s ease;

}


.warning.show {

    opacity: 1;

}


/* ========================================
   質問
======================================== */

.question {

    margin-top: 25px;

    text-align: center;

    color: #555;

    opacity: 0;

    transition:
        opacity 2s ease;

    line-height: 2;

}


.question.show {

    opacity: 1;

}


/* ========================================
   ボタンエリア
======================================== */

.button-area {

    margin-top: 40px;

    text-align: center;

}


/* ========================================
   通常ボタン
======================================== */

button {

    background: transparent;

    color: #333;

    border: 1px solid #333;

    padding: 12px 40px;

    font-size: 1rem;

    font-family: inherit;

    cursor: pointer;

    transition:
        background 0.2s,
        color 0.2s;

}


button:hover {

    background: #333;

    color: white;

}


/* ========================================
   答え入力部分
======================================== */

#answer-area {

    display: none;

    text-align: center;

    margin-top: 35px;

    padding-top: 25px;

    border-top: 1px solid #ccc;

}


#answer-area.show {

    display: block;

}


#answer-area p {

    margin-bottom: 20px;

}


/* ========================================
   入力欄
======================================== */

input {

    width: 160px;

    max-width: 80%;

    padding: 10px;

    text-align: center;

    font-size: 1.2rem;

    letter-spacing: 0.3em;

    border: 1px solid #777;

    background: white;

}


/* ========================================
   結果表示
======================================== */

#result {

    margin-top: 20px;

    min-height: 50px;

    line-height: 1.8;

}


/* ========================================
   隠しボタン
======================================== */

/*
   実際には見えにくいが、
   押せる範囲は25pxあります。
*/

#hidden-button {

    position: absolute;

    width: 30px;

    height: 30px;

    right: 20px;

    bottom: 20px;

    border: none;

    background: transparent;

    cursor: pointer;

    opacity: 0.03;

    z-index: 100;

    padding: 0;

}


/*
   マウスを乗せたときだけ
   少しだけ見える
*/

#hidden-button:hover {

    opacity: 0.25;

}


/* ========================================
   隠し数字
======================================== */

#secret-number {

    display: none;

    margin-top: 30px;

    text-align: center;

    font-size: 2rem;

    letter-spacing: 0.5em;

}


#secret-number.show {

    display: block;

}


/* ========================================
   スマホ用
======================================== */

@media (max-width: 600px) {

    body {

        align-items: flex-start;

        padding-top: 20px;

        padding-bottom: 40px;

    }


    .room {

        padding: 30px 20px;

        min-height: 650px;

    }


    h1 {

        font-size: 1.7rem;

        margin-bottom: 25px;

    }


    .record {

        font-size: 0.95rem;

        line-height: 2;

    }


    .warning {

        font-size: 1.1rem;

    }


    .question {

        font-size: 0.95rem;

    }


    button {

        padding: 11px 28px;

    }


    #hidden-button {

        width: 35px;

        height: 35px;

        right: 15px;

        bottom: 15px;

    }

}

</style>

</head>


<body>


<div class="room">


    <!-- ===================================
         タイトル
    ==================================== -->

    <h1>

        記録

    </h1>


    <!-- ===================================
         記録内容
    ==================================== -->

    <div class="record">

        <div>

            <span>記録番号：</span>

            001

        </div>


        <div>

            <span>場所：</span>

            ファンシーな島

        </div>


        <div>

            <span>状態：</span>

            正常

        </div>


        <div>

            <span>訪問者：</span>

            なし

        </div>


        <div>

            <span>最初の記録：</span>

            不明

        </div>


        <div>

            <span>最後の記録：</span>

            不明

        </div>

    </div>


    <!-- ===================================
         違和感
    ==================================== -->

    <div
        id="warning"
        class="warning"
    >

        ……おかしい。

    </div>


    <!-- ===================================
         質問
    ==================================== -->

    <div
        id="question"
        class="question"
    >

        あなたは、ここに来たはずなのに。

        <br>

        <strong>

            なぜ記録に残っていない？

        </strong>

    </div>


    <!-- ===================================
         調べるボタン
    ==================================== -->

    <div class="button-area">

        <button
            id="continue-button"
            onclick="showAnswer()"
        >

            記録を調べる

        </button>

    </div>


    <!-- ===================================
         答え入力
    ==================================== -->

    <div
        id="answer-area"
    >

        <p>

            記録番号を入力してください。

        </p>


        <input
            id="answer"
            type="text"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
        >


        <br><br>


        <button
            onclick="checkAnswer()"
        >

            確認

        </button>


        <div id="result"></div>

    </div>


    <!-- ===================================
         隠し数字
    ==================================== -->

    <div
        id="secret-number"
    >

        2047

    </div>


    <!-- ===================================
         隠しボタン
    ==================================== -->

    <button
        id="hidden-button"
        onclick="revealSecret()"
        aria-label="隠しボタン"
    ></button>


</div>



<script>


/* ========================================
   最初の演出
======================================== */


/*
   2.5秒後
*/

setTimeout(function() {

    document
        .getElementById("warning")
        .classList.add("show");

}, 2500);


/*
   5秒後
*/

setTimeout(function() {

    document
        .getElementById("question")
        .classList.add("show");

}, 5000);



/* ========================================
   「記録を調べる」
======================================== */

function showAnswer() {


    const answerArea =
        document.getElementById(
            "answer-area"
        );


    /*
       入力欄を表示
    */

    answerArea.classList.add("show");


    /*
       調べるボタンを消す
    */

    document
        .getElementById(
            "continue-button"
        )
        .style.display = "none";


    /*
       入力欄にカーソルを移動
    */

    document
        .getElementById("answer")
        .focus();

}



/* ========================================
   答え確認
======================================== */

function checkAnswer() {


    const answer =
        document
            .getElementById("answer")
            .value
            .trim();


    const result =
        document.getElementById(
            "result"
        );


    /*
       正解
    */

    if (answer === "2047") {


        result.innerHTML =
            "正解。<br><br>" +
            "……この記録は、誰が残した？";


        result.style.color = "#222";


        /*
           3秒後に次のページ
        */

        setTimeout(function() {


            window.location.href =
                "record-next.html";


        }, 3000);


    }


    /*
       不正解
    */

    else {


        result.innerHTML =
            "違う。<br>" +
            "記録番号ではないようだ。";


        result.style.color = "#900";

    }

}



/* ========================================
   隠しボタン
======================================== */

function revealSecret() {


    const secret =
        document.getElementById(
            "secret-number"
        );


    /*
       2047を表示
    */

    secret.classList.add("show");

}

</script>


</body>

</html>
