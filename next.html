<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試練の間：予告</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "ヒラギノ明朝 ProN", "Hiragino Mincho ProN", "MS 明朝", "MS Mincho", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            letter-spacing: 0.1em;
            line-height: 2;
            position: relative;
            overflow: hidden;
        }
        
        /* 全体枠（画像の白い点線を再現） */
        .container {
            border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 80%;
        }

        /* 一番上の見出し（黄色） */
        .title {
            color: #ffcc00;
            font-size: 1.5rem;
            margin-bottom: 2.5rem;
            letter-spacing: 0.3em;
        }

        /* 通常の文章（薄い灰色） */
        .text-normal {
            color: #b0b0b0;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        /* 最も重要な警告文（赤・大きめ） */
        .text-alert {
            color: #ff0000;
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 2.5rem;
            letter-spacing: 0.15em;
        }

        /* 下部の補足文章（さらに薄い灰色・小さめ） */
        .text-sub {
            color: #666666;
            font-size: 0.85rem;
            margin-bottom: 3.5rem;
        }

        /* ボタンを囲むコンテナ（5秒後に表示） */
        .button-container {
            display: none;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .button-container.show {
            display: flex;
        }
        .button-container.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* 共通のボタンデザイン */
        .btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 30px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }
        
        /* ⚠️ 注意書き用のボタン（目立つように赤枠） */
        .btn-warning {
            border: 1px solid #ff0000;
            color: #ff0000;
        }
        .btn-warning:hover {
            background-color: rgba(255, 0, 0, 0.1);
            border-color: #ff0000;
        }

        /* 💻 画面全体に覆いかぶさる黒背景の注意画面（初期状態は非表示） */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: none; /* 最初は隠す */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* 一番手前に表示 */
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* 注意画面の中のテキスト（大きく真っ赤に表示） */
        .overlay-content {
            color: #ff0000;
            font-size: 2rem; /* できるだけ大きく */
            font-weight: bold;
            max-width: 800px;
            text-align: center;
            line-height: 1.8;
            margin-bottom: 3rem;
            white-space: pre-wrap; /* 改行を有効にする */
        }
    </style>
</head>
<body>

    <!-- 中央の予告コンテンツ -->
    <div class="container">
        <div class="title">次 篇 の 間 ： 終わりの始まり</div>

        <div class="text-normal">
            無事にクリアへと至った旅人よ。<br>
            しかし、君が目撃した「真実」はほんの一部に過ぎない。
        </div>

        <div class="text-alert">
            「この先、さらなる深淵が待ち受けている……<br>
            旅路はさらに長く、果てしなく伸びるだろう」
        </div>

        <div class="text-sub">
            覚悟を決め、新たな鍵を手にするがよい。<br>
            真の終焉を迎えるその時まで。
        </div>

        <!-- 5秒後にサブタイトルの下に表示されるボタン群 -->
        <div id="btn-group" class="button-container">
            <a href="index.html" class="btn">ゲームに戻る</a>
            <!-- 注意書きを開くためのボタン -->
            <button class="btn btn-warning" onclick="openNotice()">【注意】を読む</button>
        </div>
    </div>

    <!-- 💻 ボタンを押すと上にかぶさる黒背景の画面 -->
    <div id="notice-overlay" class="overlay">
        <div class="overlay-content">【注意】
本作は『ふぁんしーあいらんど』のリスペクト／オマージュとして制作された、個人の二次創作（ファンゲーム）です。

原作者様および公式とは一切関係ありません。</div>
        <!-- 注意画面を閉じるためのボタン -->
        <button class="btn" onclick="closeNotice()">閉じる</button>
    </div>

    <script>
        // 5秒（5000ミリ秒）後にボタンを表示
        setTimeout(function() {
            var btnGroup = document.getElementById('btn-group');
            btnGroup.classList.add('show');
            setTimeout(function() {
                btnGroup.classList.add('fade-in');
            }, 10);
        }, 5000);

        // 注意画面を開く関数
        function openNotice() {
            document.getElementById('notice-overlay').style.display = 'flex';
        }

        // 注意画面を閉じる関数
        function closeNotice() {
            document.getElementById('notice-overlay').style.display = 'none';
        }
    </script>

</body>
</html>
