<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>時間制限の間</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ff3333;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
        }

        /* ⏳ 15秒制限タイマー表示 */
        .timer-box {
            font-size: 32px;
            color: #ff0000;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 2px;
            background: rgba(255, 0, 0, 0.1);
            padding: 5px 30px;
            border: 2px solid #ff0000;
        }

        .room-container {
            background-color: #0a0000;
            border: 2px solid #550000;
            padding: 35px;
            border-radius: 5px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
        }

        .story-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #aaaaaa;
        }

        /* 🖼️ 3つの選択肢ボタン */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .choice-btn {
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #550000;
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'MS Mincho', 'serif';
            transition: 0.2s;
        }
        .choice-btn:hover {
            background-color: #ff3333;
            color: #000000;
            box-shadow: 0 0 10px #ff3333;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>試練の間：加速する秒針</h1>
    
    <!-- リアルタイムカウントダウンタイマー -->
    <div class="timer-box">残り時間: <span id="countdown">15</span>秒</div>

    <div class="room-container">
        <div class="story-text">
            天井から鋭いトゲがゆっくりと降りてきている……！<br>
            刻まれた文字を読め！「真の出口は、涙を流さぬもの」<br>
            並んだ3つの石像のうち、どれを動かす！？
        </div>

        <div class="choice-grid">
            <!-- 💡 正解は「泣いていない2番目の石像」に設定しています -->
            <button class="choice-btn" onclick="chooseStatue(1)">悲しげに涙を流す石像</button>
            <button class="choice-btn" onclick="chooseStatue(2)">不気味に無表情で佇む石像</button>
            <button class="choice-btn" onclick="chooseStatue(3)">血の涙を流す狂気の石像</button>
        </div>
    </div>

    <script {nonce}>
        let timeLeft = 15;
        let timerInterval;

        // ⏱️ ページを開いた瞬間から15秒のカウントダウンを開始
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("時間切れ！天井のトゲに完全に押し潰された……！");
                window.location.href = "dark-hazure2.html";
            }
        }, 1000);

        function chooseStatue(num) {
            if (timeLeft <= 0) return; // 時間切れなら何もしない
            clearInterval(timerInterval); // タイマー停止

            if (num === 2) {
                alert("ガシャリ！ 石像を回すとトゲが停止し、床に次のエリアへのハッチが開いた！");
                // 💡 クリア後は次の「10分の7の部屋」へ合流します！
                window.location.href = "hint6.html";
            } else {
                alert("うわあああ！ 罠が作動し、床が抜けて奈落の底へ落下した！");
                window.location.href = "dark-hazure2.html";
            }
        }

        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
