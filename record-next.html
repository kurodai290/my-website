<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ふぁんしーなしま - ミニゲーム</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #bfe9ff;

    font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}


#game {

    width: 100vw;

    height: 100vh;

    position: relative;

}


/*
========================================
タイトル
========================================
*/

#title {

    position: absolute;

    top: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    text-align: center;

    z-index: 20;

}


#title h1 {

    margin: 0;

    font-size: 1.8rem;

}


#status {

    margin-top: 8px;

}


/*
========================================
スタート
========================================
*/

#start-screen {

    position: absolute;

    inset: 0;

    background: rgba(255,255,255,0.85);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 50;

}


#start-screen h2 {

    font-size: 2rem;

}


#start-button {

    padding: 15px 50px;

    font-size: 1.2rem;

    cursor: pointer;

    border: 2px solid #222;

    background: white;

}


/*
========================================
ターゲット
========================================
*/

#target {

    position: absolute;

    width: 70px;

    height: 70px;

    border-radius: 50%;

    border: 3px solid #222;

    background: #fff;

    cursor: pointer;

    display: none;

    z-index: 10;

    transition:

        left 0.08s linear,

        top 0.08s linear,

        width 0.08s,

        height 0.08s;

}


#target:active {

    transform: scale(0.8);

}


/*
========================================
偽物
========================================
*/

.fake {

    position: absolute;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    border: 2px solid #555;

    background: #ddd;

    z-index: 5;

}


/*
========================================
クリア
========================================
*/

#clear-screen {

    position: absolute;

    inset: 0;

    background: rgba(255,255,255,0.95);

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 100;

}


#clear-screen h2 {

    font-size: 2.2rem;

}


#next-button {

    padding: 13px 45px;

    cursor: pointer;

    font-size: 1rem;

}


/* スマホ */

@media (max-width: 600px) {

    #title h1 {

        font-size: 1.4rem;

    }

    #target {

        width: 55px;

        height: 55px;

    }

}

</style>

</head>


<body>


<div id="game">


<div id="title">

    <h1>
        逃げるボタン
    </h1>

    <div id="status">
        0 / 10
    </div>

</div>


<!-- スタート -->

<div id="start-screen">

    <h2>

        逃げるボタン

    </h2>

    <p>

        ボタンを10回押せ！

    </p>

    <p>

        ……ただし、簡単には押させない。

    </p>


    <button id="start-button"
            onclick="startGame()">

        START

    </button>

</div>


<!-- 本物 -->

<button id="target"
        onclick="hitTarget()">

</button>


<!-- クリア -->

<div id="clear-screen">

    <h2>

        CLEAR!

    </h2>

    <p>

        ……意外とやるね。

    </p>


    <button id="next-button"
            onclick="nextStage()">

        次のステージへ

    </button>

</div>


</div>


<script>


let count = 0;

let gameStarted = false;

let targetSize = 70;

let moveTimer;


/*
========================================
スタート
========================================
*/

function startGame() {


    count = 0;

    gameStarted = true;

    targetSize = 70;


    document
        .getElementById("start-screen")
        .style.display = "none";


    const target =
        document.getElementById("target");


    target.style.display = "block";


    updateStatus();

    moveTarget();


    /*
       定期的に逃げる
    */

    moveTimer =
        setInterval(function() {

            if(gameStarted) {

                moveTarget();

            }

        }, 450);

}


/*
========================================
ターゲットを移動
========================================
*/

function moveTarget() {


    const target =
        document.getElementById("target");


    const margin = 20;


    const maxX =
        window.innerWidth -
        target.offsetWidth -
        margin;


    const maxY =
        window.innerHeight -
        target.offsetHeight -
        margin;


    const x =
        Math.random() *
        Math.max(maxX, margin);


    const y =
        Math.random() *
        Math.max(maxY, margin);


    target.style.left =
        x + "px";


    target.style.top =
        y + "px";

}


/*
========================================
本物を押した
========================================
*/

function hitTarget() {


    if(!gameStarted) {

        return;

    }


    count++;


    updateStatus();


    /*
       押すたびに小さくする
    */

    targetSize =
        Math.max(
            28,
            targetSize - 4
        );


    const target =
        document.getElementById("target");


    target.style.width =
        targetSize + "px";


    target.style.height =
        targetSize + "px";


    /*
       次の場所へ逃げる
    */

    moveTarget();


    /*
       10回でクリア
    */

    if(count >= 10) {

        clearGame();

    }

}


/*
========================================
表示
========================================
*/

function updateStatus() {


    document
        .getElementById("status")
        .textContent =
        count + " / 10";

}


/*
========================================
クリア
========================================
*/

function clearGame() {


    gameStarted = false;


    clearInterval(moveTimer);


    document
        .getElementById("target")
        .style.display =
        "none";


    document
        .getElementById("clear-screen")
        .style.display =
        "flex";

}


/*
========================================
次へ
========================================
*/

function nextStage() {


    /*
       次のページは、
       次のステージを作るときに
       ファイル名を決めます。
    */

    alert(
        "ステージクリア！\n\n" +
        "次のステージはこれから追加します。"
    );

}

</script>


</body>

</html>
