<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>記録</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #f4f1e8;

    color: #252525;

    font-family:
        "Hiragino Mincho ProN",
        "Yu Mincho",
        serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow-x: hidden;

    overflow-y: auto;

    padding: 30px 15px;

}


.room {

    width: min(850px, 100%);

    min-height: 650px;

    background: #fffdf5;

    border: 1px solid #aaa;

    padding: 45px;

    position: relative;

    box-shadow:
        0 0 25px rgba(0,0,0,0.12);

}


h1 {

    text-align: center;

    font-size: 2rem;

    font-weight: normal;

    letter-spacing: 0.3em;

    margin-top: 0;

    margin-bottom: 40px;

}


.record {

    border-top: 1px solid #999;

    border-bottom: 1px solid #999;

    padding: 25px 10px;

    line-height: 2.3;

}


.label {

    color: #777;

}


.message {

    margin-top: 35px;

    text-align: center;

    line-height: 2.2;

}


.clue {

    margin-top: 35px;

    padding: 20px;

    border: 1px solid #ccc;

    text-align: center;

    background: #faf8ef;

}


#secret {

    display: none;

    margin-top: 30px;

    text-align: center;

}


#secret.show {

    display: block;

}


.secret-number {

    font-size: 2.2rem;

    letter-spacing: 0.5em;

    margin: 15px 0;

}


#next-button {

    display: none;

    text-align: center;

    margin-top: 30px;

}


#next-button.show {

    display: block;

}


button {

    padding: 12px 40px;

    border: 1px solid #333;

    background: transparent;

    font-family: inherit;

    cursor: pointer;

}


button:hover {

    background: #333;

    color: white;

}


/*
========================================
隠しボタン
========================================
*/

#hidden-button {

    position: absolute;

    right: 18px;

    bottom: 18px;

    width: 35px;

    height: 35px;

    border: none;

    background: transparent;

    opacity: 0.02;

    cursor: pointer;

    z-index: 10;

}


#hidden-button:hover {

    opacity: 0.2;

}


/* スマホ */

@media (max-width: 600px) {

    .room {

        padding: 30px 20px;

    }

    h1 {

        font-size: 1.6rem;

    }

}

</style>

</head>


<body>


<div class="room">


<h1>

記録

</h1>


<div class="record">

    <div>

        <span class="label">
            記録番号：
        </span>

        002

    </div>


    <div>

        <span class="label">
            場所：
        </span>

        ふぁんしーなしま

    </div>


    <div>

        <span class="label">
            状態：
        </span>

        正常

    </div>


    <div>

        <span class="label">
            記録対象：
        </span>

        プレイヤー

    </div>


    <br>


    <div>

        <span class="label">
            備考：
        </span>

        特になし

    </div>

</div>


<div class="message">

    ……特になにもない。

</div>


<div class="clue">

    <strong>

        最後に残されたものは、

        <br>

        記録そのものではない。

    </strong>

</div>


<div id="secret">


    <div>

        隠された番号

    </div>


    <div class="secret-number">

        2047

    </div>


    <div>

        この番号を覚えておこう。

    </div>


</div>


<div id="next-button">

    <button onclick="goNext()">

        次へ進む

    </button>

</div>


<!-- 隠しボタン -->

<button
    id="hidden-button"
    onclick="findSecret()"
    aria-label="隠しボタン"
></button>


</div>


<script>


function findSecret() {


    document
        .getElementById("secret")
        .classList.add("show");


    document
        .getElementById("next-button")
        .classList.add("show");


}


function goNext() {


    window.location.href =
        "record-next.html";


}

</script>


</body>

</html>
