<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>最後の審判</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0; padding: 0; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            user-select: none; overflow: hidden;
        }

        h1 {
            color: #ff3333;
            font-size: 26px;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ff0000;
        }

        .hint {
            color: #555555;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .room-container {
            background-color: #0d0000;
            border: 2px solid #550000;
            padding: 40px;
            border-radius: 5px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.1);
        }

        .story-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #aaaaaa;
        }

        .examine-btn {
            background-color: #220000;
            color: #ff3333;
            border: 1px solid #660000;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'MS Mincho', 'serif';
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .examine-btn:hover {
            background-color: #ff3333;
            color: #000000;
            box-shadow: 0 0 15px #ff3333;
        }

        input {
            background-color: #000000;
            border: 1px solid #660000;
            color: #ff3333;
            font-size: 24px;
            width: 120px;
            text-align: center;
            padding: 8px;
            outline: none;
        }

        .submit-btn {
            display: block;
            margin: 25px auto 0 auto;
            background-color: #111111;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 10px 40px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'MS Mincho', 'serif';
        }
        .submit-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>試練の間：最後の審判</h1>
    <div class="hint">――絶望の終着駅。天秤を釣り合わせ、最後の鍵を落とせ――</div>

    <div class="room-container">
        <div class="story-text">
            重々しい鉄の扉の前に、巨大な「漆黒の天秤」が置かれている。<br>
            左の皿にはあなたの「罪の結晶」が乗っており、激しく傾いている。<br>
            右の皿に正しい重さの石を乗せなければ、扉は絶対に開かない……。
        </div>

        <button class="examine-btn" onclick="examineScale()">天秤を観察する</button>

        <div>
            <p style="font-size:14px; color:#666;">天秤を釣り合わせる『石の重さ（数字）』は？</p>
            <input type="text" id="scaleInput" placeholder="0" onkeydown="if(event.key==='Enter') checkScale()">
            <button class="submit-btn" onclick="checkScale()">石を乗せる</button>
        </div>
    </div>

    <script {nonce}>
        function examineScale() {
            alert("『天秤の土台には「この部屋が示す深淵の数字を刻め」と血文字で書かれている……。』\n現在の生存深度は「10分の9」だ。");
        }

        function checkScale() {
            const ans = document.getElementById("scaleInput").value.trim();
            
            // 💡 正解は「9」です
            if (ans === "9") {
                alert("ガシャァァン！！ 天秤が完璧に水平になり、背後の巨大な壁が崩れ落ちた！");
                // 🗺️ 予定通り、次の「10分の10の部屋」へ進みます！
                window.location.href = "button-room10.html";
            } else {
                alert("ピピッ……！ 不正解。天秤が完全にひっくり返り、鋭い刃があなたを貫いた。");
                window.location.href = "dark-hazure2.html";
            }
        }

        window.addEventListener('keydown', function (e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
        });
    </script>

</body>
</html>
