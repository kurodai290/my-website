<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ようこそ...</title>
    <style>
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'MS Mincho', 'serif';
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            user-select: none;
        }

        /* 👁️ 完全にステルス化した隠し入力欄（画面上には見えません） */
        #secretInput {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 0px;
            height: 0px;
            opacity: 0;
            pointer-events: none;
        }

        /* メイン画面の見た目 */
        .title {
            color: #d60000;
            font-size: 32px;
            letter-spacing: 10px;
            margin-top: 15vh;
            text-align: center;
            text-shadow: 0 0 10px rgba(214, 0, 0, 0.7);
            animation: flicker 3s infinite;
        }

        .warning {
            color: #888888;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
        }

        .enter-link {
            display: block;
            width: 100px;
            margin: 80px auto 0 auto;
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            border: 1px solid #333333;
            padding: 15px 40px;
            transition: 0.5s;
            text-align: center;
        }

        .enter-link:hover {
            color: #ff0000;
            border-color: #ff0000;
            background-color: #1a0000;
            box-shadow: 0 0 15px #ff0000;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.3; }
        }
    </style>
</head>
<body id="mainBody" oncontextmenu="return isLocked;">

    <!-- 完全に見えない隠し入力欄 -->
    <input type="text" id="secretInput" autocomplete="off">

    <!-- メイン画面 -->
    <div>
        <div class="title">ふぁんしーなしま</div>
        <p class="warning">※心臓の弱い方はご注意ください</p>
        <a href="room1.html" class="enter-link">はいる</a>
    </div>

    <script>
        // 🔒 初期状態はロックON（true）
        var isLocked = true;

        // 👆 画面のどこでもクリックしたら、隠し入力欄にフォーカスを当てる
        window.addEventListener('click', function() {
            document.getElementById("secretInput").focus();
        });

        // ⌨️ キーボードが押された時も、自動的に隠し入力欄にフォーカスを誘導
        window.addEventListener('keydown', function(e) {
            if (!e.ctrlKey && !e.metaKey && e.key !== 'F12') {
                document.getElementById("secretInput").focus();
            }

            // デベロッパーツール対策のキーボード監視
            if (isLocked) {
                if (e.key === 'F12') { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
                if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
            }
        });

        // 🛠️ 隠し入力欄でのEnterキー判定
        document.getElementById("secretInput").addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                // 入力された文字を小文字に統一し、前後のスペースを削除
                var value = this.value.trim().toLowerCase();

                // 🏮 「kurodai」で falseclear.html へ遷移
                if (value === "kurodai") {
                    window.location.href = "falseclear.html";
                    return;
                }
                 // 🏮 「0901」で search.html へ遷移
                if (value === "0901") {
                    window.location.href = "fail-list.html";
                    return;
                }
                // 🔒 解除コード「unlockf12」
                else if (value === "unlockf12") {
                    isLocked = false;
                    alert("デベロッパーツールの制限を解除しました。");
                } 
                // 👻 「おばけ」
                else if (value === "おばけ") {
                    alert("秘密の裏口を見つけたね...");
                    window.location.href = "code-room.html";
                    return;
                } else {
                    alert("ちがう。");
                }

                // 入力をクリアしてリセット
                this.value = "";
                this.blur();
            }
        });
    </script>

</body>
</html>
